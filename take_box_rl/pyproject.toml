[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "take-box-rl"
version = "0.1.0"
description = "MuJoCo dual-arm take_box cell: PPO training env, scripted grasp/carry flows, model builder"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.1,<4",
    "gymnasium>=0.29,<2",
    "stable-baselines3>=2.3,<3",
    "torch>=2.0",
    "imageio>=2.31",
    "numpy>=1.24,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
take-box-flow = "take_box_flows.full_task:main"

# 包就地使用（cd 进来跑脚本）；`pip install -e .` 只是额外提供 take-box-flow 入口。
# 只暴露 take_box_* 两个包：同级仓库同名文件很多（env/、train_ppo.py、eval_rollout.py…），
# 装成顶层模块会互相遮蔽。
[tool.setuptools]
packages = ["take_box_env", "take_box_flows"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
