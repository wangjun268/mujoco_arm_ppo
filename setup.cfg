[flake8]
max-line-length = 100
# E402: several scripts deliberately set the matplotlib Agg backend (or the
#       software-GL env vars) *before* importing the module that needs them.
# E203: slice spacing that Black produces (PSF/black#2643).
extend-ignore = E402, E203
exclude = .git,__pycache__,results,build

[tool:pytest]
testpaths = tests
addopts = -q
